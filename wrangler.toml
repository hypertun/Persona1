# Cloudflare Workers configuration — enables:
#   npx wrangler dev              (local preview: dist/ assets + /api/contact)
#   npx wrangler deploy           (direct upload deploy)
# Git-integration builds (dashboard): build `npm run build`, deploy `npx wrangler deploy`.
name = "ivanbuilds"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
